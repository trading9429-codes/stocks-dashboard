<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00e5a0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Candlesticks -->
  <g fill="#1e293b">
    <!-- Bar 1 -->
    <line x1="120" y1="240" x2="120" y2="400" stroke="#334155" stroke-width="6"/>
    <rect x="100" y="280" width="40" height="90" rx="6" fill="#3b82f6" opacity="0.8"/>

    <!-- Bar 2 -->
    <line x1="210" y1="180" x2="210" y2="380" stroke="#334155" stroke-width="6"/>
    <rect x="190" y="220" width="40" height="120" rx="6" fill="#10b981" opacity="0.85"/>

    <!-- Bar 3 -->
    <line x1="300" y1="140" x2="300" y2="340" stroke="#334155" stroke-width="6"/>
    <rect x="280" y="160" width="40" height="130" rx="6" fill="#f59e0b" opacity="0.85"/>

    <!-- Bar 4 -->
    <line x1="390" y1="80" x2="390" y2="300" stroke="#334155" stroke-width="6"/>
    <rect x="370" y="110" width="40" height="140" rx="6" fill="#10b981"/>
  </g>

  <!-- Glowing Trend Line -->
  <path d="M 80 360 Q 180 320 230 240 T 360 160 T 430 90" fill="none" stroke="url(#line)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Arrow Head -->
  <circle cx="430" cy="90" r="14" fill="#00e5a0" filter="url(#glow)"/>
</svg>
