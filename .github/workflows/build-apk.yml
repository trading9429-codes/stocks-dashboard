name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Android SDK location: $ANDROID_HOME"

      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-alerts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          name: "📱 Stock Scanner Android App (Latest APK)"
          tag_name: "apk-latest"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          body: |
            ### 📱 Stock Scanner Android App - Ready to Install
            
            **Direct Download:** Click **`app-debug.apk`** below to install directly on your Android phone!
            
            #### Features:
            - 📡 **Real-time Mobile Trading Cards**: Custom 1-hand thumb layout.
            - 🔔 **Native Android Notifications**: High-priority alert channel with vibration.
            - 🛒 **1-Click Broker Orders**: Zerodha Kite Basket JSON copy & Dhan web order link.
            - 📊 **5-minute TradingView Chart Bottom Sheet**.
            - 🚀 Built automatically from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
